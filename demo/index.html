<title>oscd-editor-source demo</title>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&family=Roboto:wght@300;400;500&display=swap"
/>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css?family=Material+Symbols+Outlined&display=block"
/>
<oscd-shell></oscd-shell>

<script type="module">
  import '@webcomponents/scoped-custom-element-registry';
  (async function () {
    await import('https://omicronenergyoss.github.io/oscd-shell/oscd-shell.js');

    const oscdShell = document.querySelector('oscd-shell');
    const params = new URL(document.location).searchParams;
    for (const [name, value] of params) {
      oscdShell.setAttribute(name, value);
    }

    const filename = 'sample.scd';
    const sample = await fetch(filename).then(r => r.text());
    oscdShell.docs = {
      [filename]: new DOMParser().parseFromString(sample, 'application/xml'),
    };
    oscdShell.docName = filename;

    const { plugins } = await import('./plugins.js');
    oscdShell.plugins = plugins;
  })();
</script>

<style>
  * {
    --oscd-theme-text-font: 'Roboto';
    --oscd-theme-icon-font: 'Material Symbols Outlined';

    margin: 0px;
    padding: 0px;
  }

  abbr {
    text-decoration: none;
    border-bottom: none;
  }
</style>
